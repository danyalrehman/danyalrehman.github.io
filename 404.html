  <script>
    // Respect the saved / OS theme before paint (storage can throw when blocked).
    try {
      var t = localStorage.getItem('dark-mode');
      var d = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (t === 'on' || (t === null && d)) document.documentElement.classList.add('dark-mode');
    } catch (e) { /* storage unavailable — fall back to the light theme */ }
  </script>

  <style>
    :root {
      --accent-primary: #0067cf;
      --accent-primary-rgb: 0, 103, 207;
      --accent-deep: #213c7a;
      --accent-deep-rgb: 33, 60, 122;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      color-scheme: light dark;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      position: relative;
      overflow: hidden;
      color: #333;
      background-color: #f8f9fa;
      font-family: 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* Ambient gradient wash + drift, echoing the main site. */
    body::before {
      content: "";
      position: fixed;
      inset: -10%;
      z-index: -2;
      background:
        radial-gradient(42% 44% at 16% 18%, rgba(33, 60, 122, 0.20), transparent 70%),
        radial-gradient(38% 40% at 84% 14%, rgba(184, 125, 150, 0.16), transparent 70%),
        radial-gradient(44% 46% at 50% 94%, rgba(0, 103, 207, 0.18), transparent 70%),
        radial-gradient(34% 36% at 88% 68%, rgba(180, 1, 1, 0.10), transparent 70%),
        radial-gradient(36% 38% at 12% 72%, rgba(124, 92, 196, 0.14), transparent 70%);
      animation: nf-drift 32s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes nf-drift {
      0%   { transform: translate3d(0, 0, 0) scale(1); }
      50%  { transform: translate3d(-2%, 1.5%, 0) scale(1.06); }
      100% { transform: translate3d(2%, -1%, 0) scale(1.02); }
    }

    .nf {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.15rem;
      text-align: center;
      padding: 5.5rem 1.25rem 3rem;
    }

    /* Brand pill — mirrors the site's rounded nav. */
    .nf-brand {
      position: fixed;
      top: 18px;
      left: 20px;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.4rem 0.85rem 0.4rem 0.5rem;
      border-radius: 999px;
      text-decoration: none;
      color: var(--accent-deep);
      font-weight: 600;
      font-size: 14px;
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(var(--accent-deep-rgb), 0.1);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05), 0 8px 22px -14px rgba(var(--accent-deep-rgb), 0.4);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      transition: transform 0.18s var(--ease-out), box-shadow 0.18s var(--ease-out);
    }
    .nf-brand:hover {
      transform: translateY(-1px);
      box-shadow: 0 2px 4px rgba(15, 23, 42, 0.06), 0 12px 26px -14px rgba(var(--accent-deep-rgb), 0.5);
    }
    .nf-brand img { width: 24px; height: 24px; border-radius: 7px; display: block; }

    /* Noise panel — echoes the homepage denoise portrait, but the sample never
       converges: this URL was never generated. */
    .nf-panel {
      position: relative;
      width: min(360px, 78vw);
      aspect-ratio: 16 / 10;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(var(--accent-deep-rgb), 0.16);
      box-shadow:
        0 1px 2px rgba(15, 23, 42, 0.06),
        0 30px 60px -30px rgba(var(--accent-primary-rgb), 0.4);
    }
    .nf-noise { display: block; width: 100%; height: 100%; }
    .nf-panel::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(78% 78% at 50% 50%, rgba(0, 0, 0, 0.58), transparent 80%);
      pointer-events: none;
    }
    .nf-code {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 1;
      font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif;
      font-weight: 400;
      font-size: clamp(78px, 17vw, 136px);
      line-height: 1;
      letter-spacing: 0.02em;
      color: #ffffff;
      text-shadow: 0 2px 36px rgba(0, 0, 0, 0.65);
    }

    .nf-title {
      font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif;
      font-weight: 400;
      font-size: clamp(28px, 5.4vw, 44px);
      line-height: 1.08;
      letter-spacing: -0.014em;
      color: var(--accent-deep);
      margin: 0.7rem 0 0;
    }
    .nf-sub {
      max-width: 31rem;
      margin: 0;
      color: #5b6573;
      font-size: 15.5px;
      line-height: 1.55;
    }
    .nf-path {
      margin: 0.15rem 0 0;
      max-width: 90vw;
      font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
      font-size: 12.5px;
      letter-spacing: -0.01em;
      color: #8a93a3;
      word-break: break-all;
    }
    .nf-path b { color: var(--accent-deep); font-weight: 600; }

    .nf-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem;
      justify-content: center;
      margin-top: 0.7rem;
    }
    .nf-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.62rem 1.2rem;
      border-radius: 11px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      border: 1px solid rgba(var(--accent-deep-rgb), 0.14);
      background: rgba(var(--accent-deep-rgb), 0.05);
      color: var(--accent-deep);
      transition: background 0.16s var(--ease-out), border-color 0.16s var(--ease-out), transform 0.16s var(--ease-out), box-shadow 0.16s var(--ease-out);
    }
    .nf-btn:hover { background: rgba(var(--accent-deep-rgb), 0.1); transform: translateY(-1px); }
    .nf-btn svg { width: 15px; height: 15px; flex: none; }
    .nf-btn-primary {
      background: var(--accent-primary);
      border-color: transparent;
      color: #ffffff;
      box-shadow: 0 2px 10px -3px rgba(var(--accent-primary-rgb), 0.5);
    }
    .nf-btn-primary:hover {
      background: var(--accent-primary);
      color: #ffffff;
      box-shadow: 0 4px 14px -4px rgba(var(--accent-primary-rgb), 0.6);
    }

    /* ---- Dark mode ---- */
    html.dark-mode body { color: #d8d8d8; background-color: #141317; }
    html.dark-mode .nf-brand {
      color: #cbd9f2;
      background: rgba(30, 30, 38, 0.7);
      border-color: rgba(255, 255, 255, 0.1);
    }
    html.dark-mode .nf-panel { border-color: rgba(255, 255, 255, 0.1); }
    html.dark-mode .nf-title { color: #cbd9f2; }
    html.dark-mode .nf-sub { color: #9aa3b3; }
    html.dark-mode .nf-path { color: #6f7787; }
    html.dark-mode .nf-path b { color: #9ec5ff; }
    html.dark-mode .nf-btn {
      background: rgba(255, 255, 255, 0.07);
      color: #cdd9ee;
      border-color: rgba(255, 255, 255, 0.12);
    }
    html.dark-mode .nf-btn:hover { background: rgba(255, 255, 255, 0.12); color: #ffffff; }
    html.dark-mode .nf-btn-primary { background: var(--accent-primary); color: #ffffff; }

    @media (max-width: 480px) {
      .nf-brand { top: 12px; left: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      body::before { animation: none; }
    }
  </style>
</head>

  <script>
    // When opened straight from disk (file://) the root-relative links can't
    // resolve — but this file lives at the site root, so relative paths do.
    // Rewrite them for local preview only; the deployed site keeps the
    // root-relative originals (required since Pages serves 404 at any path).
    if (location.protocol === 'file:') {
      document.querySelectorAll('a[href^="/"]').forEach((a) => {
        const href = a.getAttribute('href');
        a.setAttribute('href', href === '/' ? './index.html' : '.' + href);
      });
    }

    // Surface the path the visitor actually requested.
    (() => {
      const el = document.getElementById('nf-path');
      if (!el) return;
      const path = location.pathname + location.search;
      el.innerHTML = 'Requested: <b></b>';
      el.querySelector('b').textContent = path;
    })();

    // Living static in the panel — the "sample" that never converges. Rendered
    // at a capped backing resolution and frozen for prefers-reduced-motion.
    (() => {
      const canvas = document.getElementById('nf-noise');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      if (!ctx) return;

      let frame;
      const size = () => {
        const r = canvas.getBoundingClientRect();
        const scale = Math.min(1, 320 / Math.max(1, r.width));
        canvas.width = Math.max(1, Math.round(r.width * scale));
        canvas.height = Math.max(1, Math.round(r.height * scale));
        frame = ctx.createImageData(canvas.width, canvas.height);
      };
      const paint = () => {
        const d = frame.data;
        for (let i = 0; i < d.length; i += 4) {
          const v = (Math.random() * 255) | 0;
          d[i] = d[i + 1] = d[i + 2] = v;
          d[i + 3] = 255;
        }
        ctx.putImageData(frame, 0, 0);
      };

      size();
      paint();

      const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!reduce) {
        let last = 0;
        const loop = (t) => {
          if (t - last > 42) { paint(); last = t; }
          requestAnimationFrame(loop);
        };
        requestAnimationFrame(loop);
      }

      let rt;
      window.addEventListener('resize', () => {
        clearTimeout(rt);
        rt = setTimeout(() => { size(); paint(); }, 150);
      });
    })();
  </script>
